# CRSLLM Provider Registry
#
# Bundled with CRSLLM — contains base URLs and discovery endpoints for all
# known LLM providers from FreeLLMAPI and LiteLLM.
#
# The user's crsllm.toml references providers by name here and supplies the
# api_key. CRSLLM merges the registry with the user config at startup.
#
# Provider metadata:
#   base_url     — base URL for the provider's API
#   auth_type    — "bearer" (Bearer <key>),
#                  "api_key" (x-api-key: <key>),
#                  "query" (Google-style ?key=<key>)
#   models_path  — path appended to base_url for /v1/models discovery
#   label        — human-readable label

# ──── OpenAI-compatible providers ──────────────────────────────

[registry.openai]
base_url = "https://api.openai.com"
auth_type = "bearer"
models_path = "/v1/models"
label = "OpenAI"

